server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:

      # ================= ROUTES =================
      routes:

        # ---------- AUTH SERVICE ----------
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        # ---------- ZONE SERVICE ----------
        - id: zone-service
          uri: lb://ZONE-SERVICE
          predicates:
            - Path=/api/zones/**
          filters:
            - name: Authentication

        # ---------- SENSOR SERVICE ----------
        - id: sensor-service
          uri: lb://SENSOR-SERVICE
          predicates:
            - Path=/api/sensors/**
          filters:
            - name: Authentication

        # ---------- CROP SERVICE ----------
        - id: crop-service
          uri: lb://CROP-INVENTORY-SERVICE
          predicates:
            - Path=/api/crops/**
          filters:
            - name: Authentication

      # Enable service discovery routing (optional but powerful)
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

# ================= EUREKA =================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

# ================= JWT CONFIG =================
jwt:
  secret: "CHANGE_THIS_TO_ENV_SECRET_KEY"

# ================= ACTUATOR =================
management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway

  endpoint:
    gateway:
      enabled: true

# ================= LOGGING =================
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO